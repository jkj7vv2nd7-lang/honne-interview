<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>著者憑依・本音インタビュー｜現代文・壁打ち特化</title>
<meta name="description" content="クセの強い著者たちにインタビューして本音を引き出す、現代文・壁打ち特化アプリ。高校受験・共通テスト・難関大二次記述まで、全20問の本音インタビュー。">
<meta property="og:title" content="著者憑依・本音インタビュー">
<meta property="og:description" content="著者は、本音でしか語らない。クセ者ぞろいの著者6人から本音を引き出す現代文トレーニング。">
<meta property="og:type" content="website">
<meta property="og:image" content="og-image.png">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#26222e; --paper:#f8f3e6; --paper2:#fffdf6;
  --wine:#7a1f2b; --wine2:#9c2b3a; --gold:#c9962e; --gold2:#eec25e;
  --teal:#14666b; --navy:#2c3a67;
  --shadow:0 4px 14px rgba(38,34,46,.16);
  --ch1:#2563eb; --ch2:#7c3aed; --ch3:#be185d; --ch4:#b45309;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Mincho ProN","Hiragino Sans","Noto Sans JP",serif;
  background:#171320 radial-gradient(circle at 15% 0%, #3d2b4d 0%, transparent 55%),
             radial-gradient(circle at 90% 100%, #4d3410 0%, transparent 50%);
  color:var(--ink); min-height:100vh;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 40px rgba(0,0,0,.45); position:relative; overflow:hidden;
  display:flex; flex-direction:column;}
.screen{display:none; flex-direction:column; flex:1; min-height:0;}
.screen.active{display:flex;}
button{font-family:inherit; cursor:pointer;}
.btn{
  border:none; border-radius:999px; padding:14px 22px; font-size:17px; font-weight:800;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
  background:linear-gradient(180deg,var(--wine2),var(--wine)); color:#fff;
  box-shadow:0 4px 0 #4d1219, var(--shadow); transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #4d1219;}
.btn.sub{background:linear-gradient(180deg,#fdfdfd,#eae4cf); color:var(--ink); box-shadow:0 4px 0 #b3a888, var(--shadow);}
.btn.sub:active{box-shadow:0 1px 0 #b3a888;}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#4a2f00; box-shadow:0 4px 0 #8a6410, var(--shadow);}
.btn.gold:active{box-shadow:0 1px 0 #8a6410;}
.btn:disabled{opacity:.45; pointer-events:none;}
.btn.big{font-size:20px; padding:16px 30px; width:100%;}
.sound-toggle{
  border:2px solid var(--ink); background:#fff; border-radius:999px; padding:6px 14px;
  font-size:14px; font-weight:800; font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.topbar{
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:var(--paper2); border-bottom:2px solid #e7ddc2; position:sticky; top:0; z-index:5;
}
.topbar .tb-title{font-weight:900; font-size:15px; flex:1; line-height:1.3;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.back-btn{
  border:2px solid var(--ink); background:#fff; border-radius:999px; padding:6px 13px;
  font-size:13.5px; font-weight:800; font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.linklike{background:none;border:none;color:var(--wine);font-weight:800;font-size:12.5px;text-decoration:underline;padding:2px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
/* ---------- タイトル ---------- */
#screen-title{align-items:center; text-align:center; padding:30px 18px 16px;
  background:linear-gradient(180deg,#f3dfae 0%, var(--paper) 58%);}
.title-band{
  background:linear-gradient(90deg,var(--wine),var(--navy)); color:#fff; font-weight:900;
  letter-spacing:.3em; padding:6px 16px 6px calc(16px + .3em); border-radius:4px; font-size:13.5px;
  box-shadow:var(--shadow); font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
h1.logo{margin:14px 0 2px; font-size:38px; line-height:1.25; font-weight:900; color:var(--ink);}
h1.logo .accent{color:var(--wine);}
.title-sub{font-size:15px; font-weight:700; color:#5c5470; margin:6px 0 2px; line-height:1.7;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.title-authors{display:flex; gap:6px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap;}
.title-authors .ta-face{width:52px; height:52px; background:#fff; border:2px solid #e2d7b8; border-radius:50%; padding:2px;}
.title-stats{display:flex; gap:10px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.stat-chip{
  background:#fff; border:2px solid #e2d7b8; border-radius:14px; padding:8px 14px;
  font-size:13px; font-weight:800; box-shadow:var(--shadow);
}
.stat-chip b{font-size:19px; color:var(--wine);}
.title-badge{
  display:inline-block; background:var(--gold2); color:#4a2f00; font-weight:900;
  font-size:13.5px; border-radius:999px; padding:4px 14px; margin-top:6px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.title-btns{display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; margin-top:16px;}
.title-foot{margin-top:auto; padding:18px 0 4px; font-size:12px; color:#8a8171; line-height:1.7;}
/* ---------- ステータスカード ---------- */
.status-card{
  margin:12px 14px 4px; background:linear-gradient(135deg,#3d1220,#7a1f2b 60%,#2c3a67);
  color:#fff; border-radius:18px; padding:14px 16px; box-shadow:var(--shadow);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.status-card .sc-big{font-size:13px; font-weight:800; opacity:.92;}
.status-card .sc-big b{font-size:30px; line-height:1; margin-left:4px;}
.status-card .sc-row{font-size:13px; font-weight:700; margin-top:7px; display:flex; gap:14px; flex-wrap:wrap;}
.progress-track{height:9px; background:rgba(255,255,255,.28); border-radius:99px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold2),#f97316); border-radius:99px; transition:width .5s;}
.screen .progress-track{background:#e7ddc2;}
.screen .progress-fill{background:linear-gradient(90deg,var(--gold),var(--wine2));}
/* ---------- マップ ---------- */
.level-bar{display:flex; gap:6px; flex-wrap:wrap; padding:12px 14px 2px; align-items:center;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.level-bar .lb-label{font-size:11.5px; font-weight:800; color:#8a8171;}
.level-chip{
  border:2px solid #ddd2ae; background:#fff; border-radius:999px; padding:6px 13px;
  font-size:13px; font-weight:800;
}
.level-chip.active{background:var(--wine); border-color:var(--wine); color:#fff;}
.chapter-block{padding:10px 14px 2px;}
.chapter-head{
  font-weight:900; font-size:16px; margin:8px 0 8px; padding-left:10px; border-left:6px solid var(--wine);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.stages{display:flex; flex-direction:column; gap:10px; padding-bottom:16px;}
.stage-card{
  display:flex; gap:12px; align-items:center; text-align:left; width:100%;
  background:#fff; border:2px solid #e2d7b8; border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); border-left:8px solid var(--wine);
}
.stage-card .st-face{width:58px; height:58px; flex:none; background:var(--paper); border-radius:50%; padding:2px; border:2px solid #e2d7b8;}
.stage-card .st-main{flex:1; min-width:0;}
.stage-card .st-id{font-size:11.5px; font-weight:900; color:#8a8171; letter-spacing:.08em;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.stage-card .st-title{font-size:16.5px; font-weight:900; line-height:1.35; margin:1px 0;}
.stage-card .st-author{font-size:13px; font-weight:700; color:#5c5470;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.stage-card .st-meta{display:flex; gap:10px; align-items:center; margin-top:5px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.stage-card .st-prog{font-size:12.5px; font-weight:800; color:var(--wine);}
.mini-track{flex:1; height:7px; background:#eee3c2; border-radius:99px; overflow:hidden;}
.mini-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--wine2));}
/* ---------- 紹介 ---------- */
.intro-body{padding:14px 16px 8px; overflow-y:auto;}
.intro-level{
  display:inline-block; background:#efe6cc; border-radius:999px; padding:3px 12px;
  font-size:12px; font-weight:800; color:#6b5d33; font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.intro-body h2{font-size:21px; line-height:1.4; margin:10px 0 12px;}
.author-profile{
  display:flex; gap:14px; background:#fff; border:2px solid #e2d7b8; border-radius:16px;
  padding:14px; box-shadow:var(--shadow); align-items:flex-start;
}
.author-profile .ap-avatar{width:96px; height:96px; flex:none; background:var(--paper); border-radius:50%; padding:3px; border:2px solid #e2d7b8;}
.ap-name{font-size:18px; font-weight:900; line-height:1.35;}
.ap-genre{font-size:12.5px; font-weight:800; color:var(--wine); margin-top:2px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.ap-quirk{font-size:13.5px; line-height:1.6; color:#4c4658; margin-top:5px;}
.greeting{
  margin-top:12px; background:#fdf6dd; border:2px dashed #d9c98a; border-radius:14px;
  padding:12px 14px; font-size:15px; line-height:1.75;
}
.intro-list-head{font-weight:900; font-size:14px; margin:16px 0 6px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.iv-list{display:flex; flex-direction:column; gap:7px;}
.iv-item{
  display:flex; gap:10px; align-items:center; background:#fff; border:2px solid #e7ddc2;
  border-radius:12px; padding:9px 12px; font-size:14px;
}
.iv-item .iv-state{font-size:11px; font-weight:900; border-radius:999px; padding:2px 9px; flex:none;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.iv-state.done{background:#fde68a; color:#7c4a03;}
.iv-state.weak{background:#fecaca; color:#7f1d1d;}
.iv-state.todo{background:#e5e0d0; color:#6b6552;}
.intro-btns{padding:12px 16px 18px; display:flex; flex-direction:column; gap:10px;}
/* ---------- セッション ---------- */
#screen-session{background:var(--paper);}
.session-head{
  padding:10px 14px 8px; background:var(--paper2); border-bottom:2px solid #e7ddc2;
  position:sticky; top:0; z-index:5;
}
.sh-row{display:flex; align-items:center; gap:8px;}
.sh-row .gh-stage{font-size:12px; font-weight:900; color:#8a8171; letter-spacing:.05em;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.sh-row .gh-topic{flex:1; font-size:13.5px; font-weight:800; line-height:1.3; min-width:0;}
.sh-row .gh-count{font-size:12.5px; font-weight:900; color:var(--wine);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.session-author{
  display:flex; gap:12px; align-items:center; padding:10px 14px 4px;
}
.session-author .sa-face{width:74px; height:74px; flex:none; background:#fff; border-radius:50%; padding:3px; border:2px solid #e2d7b8; position:relative;}
.session-author .sa-face.aura{box-shadow:0 0 0 4px var(--gold2), 0 0 26px 8px rgba(238,194,94,.75);}
.session-author .sa-name{font-size:16px; font-weight:900;}
.session-author .sa-int{font-size:12.5px; font-weight:800; color:var(--wine);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.passage-card{
  margin:8px 14px 4px; background:#fffdf6; border:2px solid #d9c98a; border-radius:14px;
  padding:12px 14px; box-shadow:var(--shadow);
}
.passage-card .pc-label{font-size:11px; font-weight:900; letter-spacing:.2em; color:#8a6d1f;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.passage-card .pc-text{font-size:15.5px; line-height:1.9; margin-top:4px; max-height:180px; overflow-y:auto;}
#dialogue-feed{flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:10px; min-height:120px;}
.msg{
  max-width:88%; border-radius:16px; padding:10px 13px; font-size:15px; line-height:1.75;
  box-shadow:var(--shadow); white-space:pre-wrap; word-break:break-word; position:relative;
}
.msg .msg-who{
  display:block; font-size:11px; font-weight:900; letter-spacing:.06em; margin-bottom:3px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.msg.author{background:#fff; border:2px solid #e2d7b8; align-self:flex-start; border-bottom-left-radius:4px;}
.msg.author .msg-who{color:var(--wine);}
.msg.user{background:linear-gradient(180deg,#fdf3d0,#fbe9b7); border:2px solid #e3cf8d; align-self:flex-end; border-bottom-right-radius:4px;}
.msg.user .msg-who{color:#8a6d1f;}
.msg.pushback{background:#fdf0f0; border:2px solid #d88a8a; align-self:flex-start; border-bottom-left-radius:4px;}
.msg.pushback .msg-who{color:#a11d1d;}
.msg.confess{background:linear-gradient(180deg,#fff7d6,#ffedb0); border:2px solid var(--gold); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.confess .msg-who{color:#8a6d1f;}
.msg.memo{background:#eef4f4; border:2px solid #9db8b8; align-self:stretch; max-width:100%;}
.msg.memo .msg-who{color:var(--teal);}
.honne-card{
  margin:2px 0; background:linear-gradient(135deg,#3d1220,#7a1f2b); color:#ffe9a8;
  border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); align-self:stretch; max-width:100%;
}
.honne-card .hc-label{font-size:11px; font-weight:900; letter-spacing:.18em; color:var(--gold2);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.honne-card .hc-text{font-size:15px; line-height:1.8; margin-top:4px; white-space:pre-wrap;}
.honne-card .hc-gain{font-size:12.5px; font-weight:900; color:#fff; margin-top:6px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.strategy-card{
  background:#fff; border:2px solid var(--teal); border-radius:14px; padding:12px 14px;
  box-shadow:var(--shadow); align-self:stretch; max-width:100%;
}
.strategy-card .sc-head{font-weight:900; font-size:15.5px; color:var(--teal); line-height:1.5;}
.strategy-card .sc-label{font-size:11px; font-weight:900; letter-spacing:.14em; color:#8a8171; margin-top:8px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.strategy-card .sc-text{font-size:14.5px; line-height:1.75; margin-top:2px;}
.strategy-card .sc-text.trap{color:#a11d1d;}
#input-area{padding:10px 14px 14px; background:var(--paper2); border-top:2px solid #e7ddc2;}
#input-area textarea{
  width:100%; min-height:74px; border:2px solid #d9c98a; border-radius:14px; padding:11px 12px;
  font-size:16px; line-height:1.6; font-family:inherit; background:#fff; resize:vertical;
}
.hint-chips{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px; align-items:center;}
.hint-chips .hc-label2{font-size:11px; font-weight:900; color:#8a8171;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.hint-chip{
  background:#fdf6dd; border:1.5px dashed #c9a83c; color:#6b5d33; border-radius:999px;
  padding:4px 11px; font-size:12.5px; font-weight:700;
}
.free-row{display:flex; gap:10px; margin-top:9px; align-items:stretch;}
.free-row .btn{flex:1;}
.mic-btn{
  border:2px solid var(--ink); background:#fff; border-radius:999px; width:56px; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.mic-btn.rec{background:#fecaca; border-color:#a11d1d;}
.choices{display:flex; flex-direction:column; gap:9px;}
.choice-btn{
  text-align:left; background:#fff; border:2px solid #d9c98a; border-radius:14px;
  padding:12px 13px; font-size:15px; line-height:1.65; box-shadow:var(--shadow);
  display:flex; gap:9px; align-items:flex-start;
}
.choice-btn .ch-id{
  flex:none; background:var(--wine); color:#fff; font-weight:900; border-radius:8px;
  padding:1px 9px; font-size:13px; margin-top:2px; font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
.choice-btn:active{transform:scale(.99);}
.giveup-row{margin-top:10px; text-align:center;}
#next-row{padding:10px 14px 16px; background:var(--paper2); border-top:2px solid #e7ddc2;}
.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lean{animation:lean .6s;}
@keyframes lean{0%{transform:scale(1)}40%{transform:scale(1.13) rotate(-2deg)}100%{transform:scale(1.05)}}
/* ---------- 結果 ---------- */
.result-body{padding:18px 16px; overflow-y:auto; text-align:center;}
.result-body .r-int{font-size:14px; font-weight:800; color:#5c5470;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.result-body .r-int b{font-size:38px; color:var(--wine);}
.result-list{margin:16px 0; text-align:left; display:flex; flex-direction:column; gap:8px;}
.result-item{
  display:flex; justify-content:space-between; gap:12px; background:#fff; border:2px solid #e7ddc2;
  border-radius:12px; padding:10px 13px; font-size:14.5px;
}
.result-item span:last-child{font-weight:900; text-align:right;}
.result-btns{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
/* ---------- 本音メモ帳 ---------- */
.memo-body{padding:12px 14px 18px; overflow-y:auto;}
.memo-author-head{display:flex; gap:11px; align-items:center; margin:14px 0 8px;}
.memo-author-head .ma-face{width:52px; height:52px; background:#fff; border-radius:50%; padding:2px; border:2px solid #e2d7b8;}
.memo-author-head .ma-name{font-size:16.5px; font-weight:900;}
.memo-author-head .ma-int{font-size:12px; font-weight:800; color:var(--wine);
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.memo-item{background:#fff; border:2px solid #e7ddc2; border-radius:14px; padding:11px 13px; margin-bottom:9px;}
.memo-item .mi-topic{font-weight:900; font-size:14.5px; line-height:1.45;}
.memo-item .mi-meta{font-size:11.5px; font-weight:800; color:#8a8171; margin-top:2px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
.memo-item .mi-honne{font-size:14px; line-height:1.75; margin-top:7px; background:#fdf6dd; border-radius:10px; padding:9px 11px;}
.memo-item .mi-strategy{font-size:13.5px; line-height:1.7; margin-top:7px; color:#14532d;}
.memo-item .mi-locked{font-size:13.5px; color:#8a8171; margin-top:6px; line-height:1.6;}
.memo-item .mi-row{display:flex; justify-content:flex-end; margin-top:8px;}
.memo-item .mi-row .btn{padding:9px 18px; font-size:14px;}
.empty-note{
  text-align:center; color:#8a8171; font-size:14.5px; line-height:1.8; padding:26px 10px;
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
/* ---------- 演出 ---------- */
#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:60;}
#fx-flash{position:fixed; inset:0; background:#fff8d6; opacity:0; pointer-events:none; z-index:55; transition:opacity .5s;}
#fx-stamp{
  position:fixed; left:50%; top:34%; transform:translate(-50%,-50%) rotate(-10deg) scale(3);
  border:5px solid #a11d1d; color:#a11d1d; border-radius:12px; padding:6px 22px;
  font-size:34px; font-weight:900; letter-spacing:.2em; opacity:0; pointer-events:none; z-index:61;
  background:rgba(255,253,246,.85); font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
}
#fx-stamp.show{animation:stamp .8s forwards;}
@keyframes stamp{0%{opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(3)}
  35%{opacity:1; transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
  80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(.96)}}
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section class="screen" id="screen-title">
    <div class="title-band">著者は、本音でしか語らない</div>
    <h1 class="logo">著者憑依<br><span class="accent">本音インタビュー</span></h1>

<script>
/* === LOGIC START === */
const HonneLogic = (() => {
// テキスト正規化：空白・句読点・記号を除去し、カタカナをひらがなへ寄せる（ツッコミ漫才・後輩育成ジムと同一方式）
function normalizeText(s) {
  if (s == null) return "";
  let t = String(s);
  t = t.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  t = t.replace(/[\s　、。，．・：；「」『』（）()［］<>＜＞!?！？〜~～…‥"”'’`｜|/／\-ー―_]/g, "");
  return t.toLowerCase();
}

// required_points を判定材料の断片に分解する：（注記）を外し、・や読点で割る
function pointFragments(interview) {
  const out = [];
  for (const p of interview.rubric?.required_points || []) {
    const stripped = String(p).replace(/（[^）]*）/g, "").replace(/\([^)]*\)/g, "");
    for (const frag of stripped.split(/[・、,／/]/)) {
      const n = normalizeText(frag);
      if (n) out.push(n);
    }
  }
  return out;
}

// 判定に使うキーワード：acceptable_keywords と required_points の断片を合わせ、
// 正規化＋重複除去し、1文字だけの汎用語は（他に候補がある場合）除外する
function usableKeywords(interview) {
  const raw = [...new Set([
    ...(interview.rubric?.acceptable_keywords || []).map(normalizeText),
    ...pointFragments(interview),
  ].filter(Boolean))];
  const long = raw.filter((a) => a.length >= 2);
  return long.length ? long : raw;
}
// 自由記述の正解しきい値：使えるキーワードが2種以下なら1種、3種以上なら2種の充足を要求
function freeNeed(interview) {
  return usableKeywords(interview).length <= 2 ? 1 : 2;
}

// 自由記述のトラップ照合（トラップ優先。ただし誤爆防止ガード2種つき）
// ガード1：trigger を内包する acceptable キーワードが入力に含まれていれば、その trigger は除外（前2作の方式）
// ガード2：trigger と無関係な核心キーワードだけですでに正解しきい値に達している入力は、
//         汎用的な trigger 語（例：「検索」）の混入で上書きしない
function matchTrapByText(interview, normalizedInput) {
  const acceptN = usableKeywords(interview);
  const need = freeNeed(interview);
  for (const trap of interview.shallow_pushbacks || []) {
    for (const trig of trap.trigger_keywords_or_choice || []) {
      const tn = normalizeText(trig);
      if (!tn) continue;
      if (!normalizedInput.includes(tn)) continue;
      if (acceptN.some((a) => a.includes(tn) && normalizedInput.includes(a))) continue;
      const independentHits = acceptN.filter((a) => !a.includes(tn) && normalizedInput.includes(a)).length;
      if (independentHits >= need) continue;
      return trap;
    }
  }
  return null;
}

function judgeFreeText(interview, input) {
  const n = normalizeText(input);
  if (!n) return { result: "fallback", trap: null };
  const trap = matchTrapByText(interview, n);
  if (trap) return { result: "trap", trap };
  const hits = usableKeywords(interview).filter((a) => n.includes(a)).length;
  if (hits >= freeNeed(interview)) return { result: "correct", trap: null, hits };
  return { result: "fallback", trap: null, hits };
}

function findChoice(interview, choiceId) {
  return (interview.choices || []).find((c) => c.id === choiceId) || null;
}

// 選択式のトラップ照合：trigger に選択肢IDかラベルが含まれていればそのトラップ
function matchTrapByChoice(interview, choiceId) {
  const ch = findChoice(interview, choiceId);
  const labelN = ch ? normalizeText(ch.label) : "";
  for (const trap of interview.shallow_pushbacks || []) {
    for (const trig of trap.trigger_keywords_or_choice || []) {
      if (trig === choiceId) return trap;
      const tn = normalizeText(trig);
      if (tn && labelN && tn === labelN) return trap;
    }
  }
  return null;
}

function judgeChoice(interview, choiceId) {
  // トラップ照合を正解判定より優先する（指令書・前2作の方式）
  const trap = matchTrapByChoice(interview, choiceId);
  if (trap) return { result: "trap", trap };
  if (interview.rubric && choiceId === interview.rubric.choice_id) {
    return { result: "correct", trap: null };
  }
  return { result: "fallback", trap: null };
}

// レベル絞込：target_level の表記で振り分ける
function matchesLevel(stage, filter) {
  if (!filter || filter === "all") return true;
  const lvl = stage.target_level || "";
  if (filter === "junior") return lvl.includes("高校受験");
  if (filter === "common") return lvl.includes("共通テスト");
  if (filter === "exam") return lvl.includes("難関大") || lvl.includes("二次");
  return true;
}

// 親密度の称号（総親密度 0〜560 に対して7段階）
const INTIMACY_TITLES = [
  { min: 560, title: "伝説のインタビュアー" },
  { min: 480, title: "著者たちの盟友" },
  { min: 360, title: "本音を引き出す名インタビュアー" },
  { min: 240, title: "著者の懐刀" },
  { min: 140, title: "気の置けない聞き手" },
  { min: 60, title: "顔なじみの聞き手" },
  { min: 0, title: "通りすがりの読者" },
];
function intimacyTitle(total) {
  for (const t of INTIMACY_TITLES) if (total >= t.min) return t.title;
  return "通りすがりの読者";
}

function totalIntimacyOf(chapters) {
  let total = 0;
  for (const c of chapters) for (const st of c.stages) for (const iv of st.interviews) {
    total += iv.deep_confession?.intimacy_gain || 0;
  }
  return total;
}
function totalInterviewsOf(chapters) {
  return chapters.reduce((n, c) => n + c.stages.reduce((m, st) => m + st.interviews.length, 0), 0);
}
// 著者ごとの満点（その著者の全インタビューの intimacy_gain 合計）
function authorMaxIntimacy(stage) {
  return stage.interviews.reduce((n, iv) => n + (iv.deep_confession?.intimacy_gain || 0), 0);
}
// 著者ごとの獲得済み親密度（本音を引き出したインタビュー分のみ）
function authorIntimacy(state, stage) {
  let sum = 0;
  for (const iv of stage.interviews) {
    if (state.honne[iv.interview_id]) sum += iv.deep_confession?.intimacy_gain || 0;
  }

}

// 進捗への誤答記録：コンボをリセットし、リベンジ待ち（復習対象）へ入れる
function applyWrong(state, interviewId) {
  state.combo = 0;

// 本音の引き出しに成功：初回のみ親密度を加算。一発成功（そのセッションで誤答0）ならリベンジ待ちから外す
function applyConfess(state, interview, wrongAttempts) {
  let gainAdded = 0;

    gainAdded = interview.deep_confession?.intimacy_gain || 0;
    state.intimacy += gainAdded;
  }
  state.honne[interview.interview_id] = true;

  if (state.combo > (state.bestCombo || 0)) state.bestCombo = state.combo;
  let removedWeak = false;
  if (wrongAttempts === 0 && state.weak[interview.interview_id]) {
    delete state.weak[interview.interview_id];
    removedWeak = true;
  }

}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

  findChoice, matchTrapByChoice, judgeChoice, matchesLevel,
  INTIMACY_TITLES, intimacyTitle, totalIntimacyOf, totalInterviewsOf,
  authorMaxIntimacy, authorIntimacy, applyWrong, applyConfess, escapeHtml,
};
})();

document.getElementById("map-best").textContent = prog.bestCombo;
document.getElementById("map-weak").textContent = weakCount();
document.getElementById("map-progress").style.width = (prog.intimacy / TOTAL_INTIMACY * 100) + "%";
}
function renderLevelBar() {
const box = document.getElementById("level-bar");
box.querySelectorAll(".level-chip").forEach((el) => el.remove());
for (const lv of LEVELS) {
const n = CHAPTERS.reduce((acc, c) => acc + c.stages.filter((st) => L.matchesLevel(st, lv.id)).length, 0);
const b = document.createElement("button");
b.className = "level-chip" + (ui.level === lv.id? " active": "");
b.textContent = `${lv.label}（${n}）`;
b.onclick = () => { SFX.tap(); ui.level = lv.id; renderMap();};
box.appendChild(b);
}
}
function renderMap() {
refreshMapStats();
renderLevelBar();
const box = document.getElementById("chapters-box");
box.innerHTML = "";
for (const c of CHAPTERS) {
const stages = c.stages.filter((st) => L.matchesLevel(st, ui.level));
if (!stages.length) continue;
const block = document.createElement("div");
block.className = "chapter-block";
const head = document.createElement("div");
head.className = "chapter-head";
head.style.borderLeftColor = CH_COLOR[c.chapter_id] || "var(--wine)";
head.textContent = `第${c.chapter_id}章 ${c.chapter_title}`;
block.appendChild(head);
const list = document.createElement("div");
list.className = "stages";
for (const st of stages) {
const done = st.interviews.filter((iv) => prog.honne[iv.interview_id]).length;
const aInt = L.authorIntimacy(prog, st);
const aMax = L.authorMaxIntimacy(st);
const card = document.createElement("button");
card.className = "stage-card";
card.style.borderLeftColor = CH_COLOR[c.chapter_id] || "var(--wine)";
card.innerHTML = `
<div class="st-face">${renderAuthor(st.author_persona.id, "normal")}</div>
<div class="st-main">
<div class="st-id">${st.stage_id} ／ ${L.escapeHtml(st.target_level)}</div>
<div class="st-title">${L.escapeHtml(st.stage_title)}</div>
<div class="st-author">${L.escapeHtml(st.author_persona.name)}（${L.escapeHtml(st.author_persona.genre)}）</div>
<div class="st-meta">
<span class="st-prog">本音 ${done}/${st.interviews.length} ・ 親密度 ${aInt}/${aMax}</span>
<span class="mini-track"><span class="mini-fill" style="display:block;width:${aMax? aInt / aMax * 100: 0}%"></span></span>
</div>
</div>`;
card.onclick = () => { SFX.tap(); openIntro(c, st);};
list.appendChild(card);
}
block.appendChild(list);
box.appendChild(block);
}
}

/* ---------- ステージ紹介 ---------- */
let introCtx = null;
function openIntro(chapter, stage) {
introCtx = { chapter, stage};
const p = stage.author_persona;
document.getElementById("intro-crumb").textContent = `第${chapter.chapter_id}章 ${stage.stage_id}`;
document.getElementById("intro-level").textContent = `${stage.target_level} ／ 親密度 ${L.authorIntimacy(prog, stage)}/${L.authorMaxIntimacy(stage)}`;
document.getElementById("intro-title").textContent = stage.stage_title;
document.getElementById("intro-avatar").innerHTML = renderAuthor(p.id, "normal");
document.getElementById("intro-author-name").textContent = p.name;
document.getElementById("intro-author-genre").textContent = p.genre;
document.getElementById("intro-author-quirk").textContent = p.quirk;
document.getElementById("intro-greeting").textContent = "「" + p.greeting_line + "」";
document.getElementById("intro-count").textContent = stage.interviews.length;
const list = document.getElementById("intro-list");
list.innerHTML = "";
for (const iv of stage.interviews) {
const item = document.createElement("div");
item.className = "iv-item";
const state = prog.honne[iv.interview_id]
? `<span class="iv-state done">本音ゲット</span>`
: prog.weak[iv.interview_id]
? `<span class="iv-state weak">リベンジ待ち</span>`
: `<span class="iv-state todo">未挑戦</span>`;
item.innerHTML = `${state}<span>${L.escapeHtml(iv.topic_tag)}</span>`;
list.appendChild(item);
}
show("intro");
}

/* ---------- セッション ---------- */
let session = null;
let memoReturn = "title";
function startStage(chapter, stage) {
session = {
mode: "stage", chapter, stage,
queue: stage.interviews.slice(), idx: 0,
wrongAttempts: 0, solvedCount: 0, gainTotal: 0, gaveUpCount: 0,
solved: false, gaveUp: false,
};
show("session");
loadInterview();
}
function startSingle(interviewId) {
const hit = IV_INDEX.get(interviewId);
if (!hit) return;
session = {
mode: "single", chapter: hit.chapter, stage: hit.stage,
queue: [hit.interview], idx: 0,
wrongAttempts: 0, solvedCount: 0, gainTotal: 0, gaveUpCount: 0,
solved: false, gaveUp: false,
};
show("session");
loadInterview();
}
function currentInterview() { return session.queue[session.idx];}
function setAuthorFace(emotion, aura, lean) {
const box = document.getElementById("session-avatar");
box.innerHTML = renderAuthor(session.stage.author_persona.id, emotion);
box.classList.toggle("aura",!!aura);
box.classList.remove("lean"); void box.offsetWidth;
if (lean) box.classList.add("lean");
}
function refreshAuthorInt() {
document.getElementById("session-author-int").textContent =
`この著者との親密度 ${L.authorIntimacy(prog, session.stage)}/${L.authorMaxIntimacy(session.stage)} ・ 総親密度 ${prog.intimacy}`;
}
function addMsg(cls, who, text) {
const feed = document.getElementById("dialogue-feed");
const d = document.createElement("div");
d.className = "msg " + cls;
d.innerHTML = `<span class="msg-who">${L.escapeHtml(who)}</span>${L.escapeHtml(text)}`;
feed.appendChild(d);
feed.scrollTop = feed.scrollHeight;
return d;
}
function addNode(node) {
const feed = document.getElementById("dialogue-feed");
feed.appendChild(node);
feed.scrollTop = feed.scrollHeight;
return node;
}
function strategyCardHtml(iv) {
const es = iv.exam_strategy;
return `<div class="sc-head">攻略：${L.escapeHtml(es.headline)}</div>
<div class="sc-label">鉄則</div><div class="sc-text">${L.escapeHtml(es.rule)}</div>
<div class="sc-label">陥りやすい罠</div><div class="sc-text trap">${L.escapeHtml(es.pitfall)}</div>`;
}
function showStrategy(iv) {
const d = document.createElement("div");
d.className = "strategy-card";
d.innerHTML = strategyCardHtml(iv);
addNode(d);
}
function loadInterview() {
const iv = currentInterview();
const p = session.stage.author_persona;
session.wrongAttempts = 0;
session.solved = false;
session.gaveUp = false;
document.getElementById("session-stage-badge").textContent = session.stage.stage_id + " ・ 第" + session.chapter.chapter_id + "章";
document.getElementById("session-topic").textContent = iv.topic_tag;
document.getElementById("session-count").textContent = `${session.idx + 1} / ${session.queue.length}`;
document.getElementById("session-progress").style.width = (session.idx / session.queue.length * 100) + "%";
document.getElementById("session-author-name").textContent = p.name;
refreshAuthorInt();
document.getElementById("passage-text").textContent = iv.passage_text;
document.getElementById("strategy-slot").innerHTML = "";
document.getElementById("next-row").style.display = "none";
const feed = document.getElementById("dialogue-feed");
feed.innerHTML = "";
setAuthorFace("normal", false, false);
if (session.idx === 0) addMsg("author", p.name, p.greeting_line);
addMsg("user", "インタビュアー（キミ）", iv.user_prompt);
renderInput(iv);
feed.scrollTop = 0;
}
function renderInput(iv) {
const area = document.getElementById("input-area");
area.innerHTML = "";
area.style.display = "";
if (iv.input_mode === "interview_chat") {
const chips = document.createElement("div");
chips.className = "hint-chips";
chips.innerHTML = `<span class="hc-label2">切り込みのヒント：</span>` +
(iv.rubric.required_points || []).map((pt) => `<span class="hint-chip">${L.escapeHtml(pt)}</span>`).join("");
area.appendChild(chips);
const ta = document.createElement("textarea");
ta.id = "free-input";
ta.placeholder = "著者に切り込む：自分の読みを、本文の言葉でぶつけよう";
ta.setAttribute("aria-label", "著者への切り込みを入力");
area.appendChild(ta);
const row = document.createElement("div");
row.className = "free-row";
const send = document.createElement("button");
send.className = "btn gold";
send.textContent = "切り込む！";
send.onclick = () => submitFree();
row.appendChild(send);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
const mic = document.createElement("button");
mic.className = "mic-btn";
mic.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#26222e" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="#26222e" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
mic.setAttribute("aria-label", "音声入力");
mic.onclick = () => startVoice(mic, ta);
row.appendChild(mic);
}
area.appendChild(row);
} else {
const box = document.createElement("div");
box.className = "choices";
for (const c of iv.choices || []) {
const b = document.createElement("button");
b.className = "choice-btn";
b.dataset.choiceId = c.id;
b.innerHTML = `<span class="ch-id">${L.escapeHtml(c.id)}</span><span>${L.escapeHtml(c.label)}</span>`;
b.onclick = () => submitChoice(iv, c, b);
box.appendChild(b);
}
area.appendChild(box);
}
maybeShowGiveUp(iv);
}
function maybeShowGiveUp(iv) {
if (session.solved || session.gaveUp) return;
if (session.wrongAttempts < 2) return;
const area = document.getElementById("input-area");
if (area.querySelector(".giveup-row")) return;
const row = document.createElement("div");
row.className = "giveup-row";
const b = document.createElement("button");
b.className = "linklike";
b.textContent = "どうしても切り込めなければ、模範の切り込みを見る（本音は聞き出せず、リベンジ待ちに残ります）";
b.onclick = () => giveUp(iv);
row.appendChild(b);
area.appendChild(row);
}
function startVoice(btn, ta) {
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) return;
try {
const rec = new SR();
rec.lang = "ja-JP";
rec.interimResults = false;
btn.classList.add("rec");
rec.onresult = (ev) => {
const text = ev.results[0][0].transcript || "";
ta.value = (ta.value? ta.value + "\n": "") + text;
};
rec.onend = () => btn.classList.remove("rec");
rec.onerror = () => btn.classList.remove("rec");
rec.start();
} catch (e) { btn.classList.remove("rec");}
}
function afterWrong(iv, verdict) {
L.applyWrong(prog, iv.interview_id);
session.wrongAttempts++;
saveProgress();
const card = document.getElementById("session-card");
card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
SFX.boke();
const p = session.stage.author_persona;
if (verdict.result === "trap" && verdict.trap) {
setAuthorFace(verdict.trap.author_emotion || "frown_sigh", false, false);
addMsg("pushback", p.name + "（渋い顔）", verdict.trap.pushback_line);
} else {
setAuthorFace("frown_sigh", false, false);
const hint = (iv.rubric.required_points || [])[0] || "";
addMsg("pushback", p.name + "（渋い顔）",
`……ふむ、まだ浅いな。本文の言葉にもう一度即して、切り込んでみてくれ。（ヒント：${hint}）`);
}
maybeShowGiveUp(iv);
}
function submitFree() {
if (!session || session.solved || session.gaveUp) return;
const iv = currentInterview();
const ta = document.getElementById("free-input");
const text = (ta.value || "").trim();
if (!text) { ta.focus(); return;}
addMsg("user", "インタビュアー（キミ）", text);
const verdict = L.judgeFreeText(iv, text);
if (verdict.result === "correct") confess(iv);
else afterWrong(iv, verdict);
}
function submitChoice(iv, choice, btn) {
if (!session || session.solved || session.gaveUp) return;
addMsg("user", "インタビュアー（キミ）", choice.label);
const verdict = L.judgeChoice(iv, choice.id);
if (verdict.result === "correct") confess(iv);
else {
btn.disabled = true;
btn.style.opacity = ".45";
afterWrong(iv, verdict);
}
}
function finishInterviewUI() {
document.getElementById("input-area").style.display = "none";
const row = document.getElementById("next-row");
row.style.display = "";
const last = session.idx + 1 >= session.queue.length;
document.getElementById("btn-next-interview").textContent = last? "結果を見る →": "次のインタビューへ →";
document.getElementById("session-progress").style.width = ((session.idx + 1) / session.queue.length * 100) + "%";
const feed = document.getElementById("dialogue-feed");
feed.scrollTop = feed.scrollHeight;
}
function confess(iv) {
session.solved = true;
const res = L.applyConfess(prog, iv, session.wrongAttempts);
session.solvedCount++;
session.gainTotal += res.gainAdded;
saveProgress();
const dc = iv.deep_confession;
const p = session.stage.author_persona;
runConfessEffect(dc.author_emotion);
setAuthorFace(dc.author_emotion, true, dc.author_emotion === "excited_lean_in");
addMsg("confess", p.name, dc.praise_line);
const card = document.createElement("div");
card.className = "honne-card";
card.innerHTML = `<div class="hc-label">著者の本音 ― 本音メモ帳に保存しました</div>`
+ `<div class="hc-text">${L.escapeHtml(dc.secret_honne)}</div>`
+ `<div class="hc-gain">${res.gainAdded > 0? "親密度 +" + res.gainAdded: "親密度は獲得済み（再読で深まった！）"}</div>`;
addNode(card);
showStrategy(iv);
refreshAuthorInt();
finishInterviewUI();
}
function giveUp(iv) {
if (session.solved || session.gaveUp) return;
session.gaveUp = true;
session.gaveUpCount++;
L.applyWrong(prog, iv.interview_id);
saveProgress();
SFX.tap();
setAuthorFace("frown_sigh", false, false);
addMsg("memo", "模範の切り込み（要旨）", iv.rubric.canonical_summary);
addMsg("memo", "取材メモ", "本音はまだ聞き出せていない。この問いは本音メモ帳の「リベンジ待ち」に残ります。");
showStrategy(iv);
finishInterviewUI();
}
function nextInterview() {
SFX.tap();
if (session.idx + 1 < session.queue.length) {
session.idx++;
loadInterview();
} else {
showResult();
}
}
function showResult() {
document.getElementById("result-intimacy").textContent = prog.intimacy;
document.getElementById("result-rank").textContent = L.intimacyTitle(prog.intimacy);
const list = document.getElementById("result-list");
const rows = [];
if (session.mode === "stage") {
rows.push(["ステージ", `${session.stage.stage_id} ${session.stage.stage_title}`]);
rows.push(["本音を引き出せた数", `${session.solvedCount} / ${session.queue.length}`]);
} else {
rows.push(["リベンジ", currentInterview().topic_tag]);
rows.push(["結果", session.solved? (session.wrongAttempts === 0? "一発で本音ゲット！リストから卒業": "本音ゲット！（リストには残ります）"): "また今度リベンジ"]);
}
rows.push(["獲得した親密度", `+${session.gainTotal}`]);
rows.push(["引き出した本音（累計）", `${honneCount()} / ${TOTAL_INTERVIEWS}`]);
rows.push(["最高コンボ", `${prog.bestCombo}`]);
list.innerHTML = rows.map(([k, v]) => `<div class="result-item"><span>${L.escapeHtml(k)}</span><span>${L.escapeHtml(v)}</span></div>`).join("");
document.getElementById("result-weak").textContent = weakCount();
show("result");
}

/* ---------- 本音メモ帳 ---------- */
function renderMemo() {
const body = document.getElementById("memo-body");
body.innerHTML = "";
let any = false;
for (const c of CHAPTERS) for (const st of c.stages) {
const p = st.author_persona;
const head = document.createElement("div");
head.className = "memo-author-head";
head.innerHTML = `<div class="ma-face">${renderAuthor(p.id, "normal")}</div>
<div><div class="ma-name">${L.escapeHtml(p.name)}</div>
<div class="ma-int">${st.stage_id} ・ 親密度 ${L.authorIntimacy(prog, st)}/${L.authorMaxIntimacy(st)}</div></div>`;
body.appendChild(head);
for (const iv of st.interviews) {
any = true;
const item = document.createElement("div");
item.className = "memo-item";
const modeLabel = iv.input_mode === "interview_chat"? "自由インタビュー": "選択インタビュー";
let inner = `<div class="mi-topic">${L.escapeHtml(iv.topic_tag)}</div>
<div class="mi-meta">${st.stage_id} ／ ${modeLabel} ／ 弱点：${L.escapeHtml(iv.weakness_category)}</div>`;
if (prog.honne[iv.interview_id]) {
inner += `<div class="mi-honne">${L.escapeHtml(iv.deep_confession.secret_honne)}</div>
<div class="mi-strategy">${L.escapeHtml(iv.exam_strategy.headline)} ― ${L.escapeHtml(iv.exam_strategy.rule)}（罠：${L.escapeHtml(iv.exam_strategy.pitfall)}）</div>`;
} else {
inner += `<div class="mi-locked">${prog.weak[iv.interview_id]
? "本音はまだ聞き出せていません。模範の切り込みは確認済みです。自分の言葉で切り込み直して、本音を引き出しましょう。"
: "まだ挑戦していません。著者に切り込んで、本音を引き出しましょう。"}</div>
<div class="mi-row"><button class="btn gold">${prog.weak[iv.interview_id]? "リベンジする": "挑戦する"}</button></div>`;
}
item.innerHTML = inner;
const btn = item.querySelector(".mi-row .btn");
if (btn) btn.onclick = () => { SFX.tap(); startSingle(iv.interview_id);};
body.appendChild(item);
}
}
if (!any) body.innerHTML = `<div class="empty-note">メモ帳はまだ空です。</div>`;
}

/* ---------- 画面遷移ボタン ---------- */
document.getElementById("btn-to-map").onclick = () => { SFX.tap(); renderMap(); show("map");};
document.getElementById("btn-to-memo").onclick = () => { SFX.tap(); memoReturn = "title"; renderMemo(); show("memo");};
document.getElementById("btn-back-title").onclick = () => { SFX.tap(); refreshTitle(); show("title");};
document.getElementById("btn-back-map").onclick = () => { SFX.tap(); renderMap(); show("map");};
document.getElementById("btn-start-stage").onclick = () => { SFX.fanfare(); if (introCtx) startStage(introCtx.chapter, introCtx.stage);};
document.getElementById("btn-intro-memo").onclick = () => { SFX.tap(); memoReturn = "intro"; renderMemo(); show("memo");};
document.getElementById("btn-quit-session").onclick = () => { SFX.tap(); renderMap(); show("map");};
document.getElementById("btn-next-interview").onclick = () => nextInterview();
document.getElementById("btn-result-map").onclick = () => { SFX.tap(); renderMap(); show("map");};
document.getElementById("btn-result-memo").onclick = () => { SFX.tap(); memoReturn = "map"; renderMemo(); show("memo");};
document.getElementById("btn-memo-back").onclick = () => {
SFX.tap();
if (memoReturn === "title") { refreshTitle(); show("title");}
else if (memoReturn === "intro" && introCtx) show("intro");
else { renderMap(); show("map");}
};
document.getElementById("sound-toggle-title").onclick = toggleMute;
document.getElementById("sound-toggle-map").onclick = toggleMute;
document.getElementById("sound-toggle-memo").onclick = toggleMute;
document.getElementById("btn-update").onclick = () => {
const u = new URL(location.href);
u.searchParams.set("v", "1.0.0-" + Date.now());
location.href = u.toString();
};

refreshSoundToggles();
refreshTitle();
show("title");
</script>
</body>
</html>
